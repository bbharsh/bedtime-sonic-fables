<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bedtime Sonic Fables — Serendipity Arts Festival</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; overflow:hidden; }
  #label {
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    color:#2a3858; font:10px/1 'Courier New',monospace;
    letter-spacing:.18em; text-transform:uppercase; pointer-events:none;
  }
  #err {
    display:none; position:fixed; inset:0; background:#0a0000;
    color:#f88; font:13px/1.7 monospace; padding:28px;
    white-space:pre-wrap; overflow:auto; z-index:9999;
  }
</style>
</head>
<body>
<div id="label">Bedtime Sonic Fables &nbsp;·&nbsp; drag to orbit &nbsp;·&nbsp; scroll to zoom</div>
<div id="err"></div>

<!-- Audio controls bar -->
<div id="audio-ui" style="
  position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:10px;
  background:rgba(2,6,22,0.88); backdrop-filter:blur(10px);
  padding:8px 20px; border-radius:26px;
  border:1px solid #1a2a44; font:11px/1 'Courier New',monospace;
  letter-spacing:.1em; z-index:10; white-space:nowrap;
">
  <label style="cursor:pointer; color:#5a8adf; user-select:none;">
    &#8593; UPLOAD AUDIO
    <input type="file" id="audioFile" accept="audio/*" style="display:none">
  </label>
  <button id="playBtn" style="display:none; background:none; border:none; color:#5a8adf; cursor:pointer; font-size:16px; line-height:1; padding:0 2px;">&#9654;</button>
  <span id="curTime" style="display:none; color:#2a4a78; min-width:38px; text-align:right;">0:00</span>
  <input type="range" id="seekBar" min="0" max="100" value="0" step="1"
    style="display:none; width:220px; accent-color:#2a5aaf; cursor:pointer; height:3px;">
  <span id="durTime" style="display:none; color:#2a4a78; min-width:38px;">--:--</span>
  <span style="border-left:1px solid #1a2a44; margin-left:4px; padding-left:12px; display:flex; gap:8px; align-items:center;">
    <button id="addCushionBtn" style="background:none; border:1px solid #1a3a5a; color:#5a8adf; padding:3px 10px; border-radius:12px; cursor:pointer; font:10px 'Courier New',monospace; letter-spacing:.1em;">+ CUSHION</button>
    <button id="deleteModeBtn" style="background:none; border:1px solid #1a3a5a; color:#5a8adf; padding:3px 10px; border-radius:12px; cursor:pointer; font:10px 'Courier New',monospace; letter-spacing:.1em;">✕ DELETE</button>
  </span>
  <div id="vuMeter" style="display:none; flex-direction:row; gap:2px; align-items:flex-end; height:14px; margin-left:4px;">
    <div id="vu0" style="width:3px;height:2px;background:#1a3a6a;border-radius:1px;"></div>
    <div id="vu1" style="width:3px;height:2px;background:#1a3a6a;border-radius:1px;"></div>
    <div id="vu2" style="width:3px;height:2px;background:#1a3a6a;border-radius:1px;"></div>
    <div id="vu3" style="width:3px;height:2px;background:#1a3a6a;border-radius:1px;"></div>
    <div id="vu4" style="width:3px;height:2px;background:#1a3a6a;border-radius:1px;"></div>
  </div>
</div>
<script>
window.onerror = function(m,s,l,c,e){
  var d=document.getElementById('err');
  d.style.display='block';
  d.textContent='Line '+l+': '+m+'\n\n'+(e?e.stack:'');
};
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
<script>
'use strict';

// ── RENDERER ──────────────────────────────────────────────────────────────────
var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ReinhardToneMapping;
renderer.toneMappingExposure = 1.4;
document.body.appendChild(renderer.domElement);

// ── SCENE ─────────────────────────────────────────────────────────────────────
var scene = new THREE.Scene();
scene.background = new THREE.Color(0x010310);
scene.fog = new THREE.FogExp2(0x010310, 0.036);

// ── CAMERA ────────────────────────────────────────────────────────────────────
var camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.05, 40);
camera.position.set(3.8, 1.3, 3.8);

var controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.target.set(0, 2.0, 0);
controls.minDistance = 0.4;
controls.maxDistance = 5.8;
controls.minPolarAngle = 0.1;
controls.maxPolarAngle = Math.PI * 0.86;
controls.update();

// ── LIVE PARAMS ───────────────────────────────────────────────────────────────
var P = {
  frequency:   2.8,
  speed:       0.22,
  complexity:  3,
  fogDensity:  0.036,
  ceilGlow:    1.4,
  ambient:     0.12,
  haze:        0.55,
  colorDark:   '#010614',
  colorBright: '#7aaeff',
  colorAccent: '#2840b0',
};

// ── UNIFORMS ──────────────────────────────────────────────────────────────────
var uTime  = { value: 0 };
var uFreq  = { value: P.frequency };
var uSpeed = { value: P.speed };
var uComp  = { value: P.complexity };
var uC1    = { value: new THREE.Color(P.colorDark) };
var uC2    = { value: new THREE.Color(P.colorBright) };
var uC3    = { value: new THREE.Color(P.colorAccent) };
var uBass  = { value: 0.0 };
var uMid   = { value: 0.0 };
var uHigh  = { value: 0.0 };
var uLevel = { value: 0.0 };

function mkU(bri, isW) {
  return {
    time:uTime, frequency:uFreq, speed:uSpeed, complexity:uComp,
    color1:uC1, color2:uC2, color3:uC3,
    audioBass:uBass, audioMid:uMid, audioHigh:uHigh, audioLevel:uLevel,
    brightness:{ value:bri }, isWater:{ value:isW }
  };
}

// ── GLSL ──────────────────────────────────────────────────────────────────────
var VERT = 'varying vec2 vUv;\nvoid main(){\n  vUv=uv;\n  gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);\n}';

var FRAG = [
'precision highp float;',
'varying vec2 vUv;',
'uniform float time,frequency,speed,complexity;',
'uniform vec3 color1,color2,color3;',
'uniform float brightness,isWater;',
'uniform float audioBass,audioMid,audioHigh,audioLevel;',

'float h21(vec2 p){p=fract(p*vec2(127.1,311.7));p+=dot(p,p+74.3);return fract(p.x*p.y);}',
'float noise(vec2 p){vec2 i=floor(p);vec2 f=fract(p);f=f*f*(3.0-2.0*f);',
'  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y);}',

'float wv(vec2 p,vec2 src,float f,float t){return sin(length(p-src)*f*6.28318-t);}',

'float cymatics(vec2 p){',
'  float r=length(p); float a=atan(p.y,p.x);',
'  float t=time*speed;',
// frequency uniform is already modulated by bass from JS (smooth lerp)
'  float f=frequency;',
// Overall level drives amplitude
'  float amp=1.0+audioLevel*0.9;',
'  float v=0.0;',
'  vec2 d1=vec2(0.18*cos(t*0.07+1.1), 0.14*sin(t*0.09+0.5));',
'  vec2 d2=vec2(-0.22*sin(t*0.06+2.3), 0.20*cos(t*0.08+1.8));',
'  vec2 d3=vec2(0.15*cos(t*0.11+0.7), -0.24*sin(t*0.07+3.1));',
'  vec2 d4=vec2(-0.18*sin(t*0.09+1.5), -0.16*cos(t*0.10+0.3));',
'  v+=wv(p,d1,f,t)*0.28*amp;',
'  v+=wv(p,d2,f*0.88,t*1.1)*0.24*amp;',
'  v+=wv(p,d3,f*1.12,t*0.93)*0.22*amp;',
'  v+=wv(p,d4,f*0.95,t*1.07)*0.18*amp;',
'  v+=wv(p,vec2(0.38,0.22),f*0.82,t)*0.14;',
'  v+=wv(p,vec2(-0.32,-0.28),f*1.0,t*0.9)*0.13;',
'  v+=wv(p,vec2(0.08,-0.42),f*0.93,t*1.05)*0.12;',
'  v+=sin(f*r*6.28318-t*0.8)*0.10;',
// Mids boost angular complexity
'  if(complexity>=2.0){float n=max(3.0,floor(f*1.4+0.5));v+=cos(n*a+t*0.15)*sin(f*r*5.5)*(0.12+audioMid*0.18);}',
'  if(complexity>=3.0){float m=max(5.0,floor(f*2.1+0.5));v+=cos(m*a-t*0.09)*sin(f*r*4.2)*(0.09+audioMid*0.12);}',
// Highs add noise sparkle
'  v+=(noise(p*f*2.5+t*0.12)-0.5)*(0.08+audioHigh*0.18);',
'  return v;',
'}',

'void main(){',
'  vec2 uv=vUv*2.0-1.0;',
'  float r=length(uv);',
'  float fd=1.0-smoothstep(0.88,1.0,r);',
'  if(fd<0.001) discard;',
'  float v=cymatics(uv);',
'  float n=v*0.5+0.5;',
// Highs boost crest sparkle
'  float cr=pow(max(0.0,sin(v*10.0)),7.0)*(0.5+audioHigh*1.5);',
'  float cr2=pow(max(0.0,sin(v*5.0+0.5)),4.0)*(0.3+audioMid*0.6);',
'  vec3 col=mix(color1,color2,pow(n,0.55));',
'  col=mix(col,color3*1.4,pow(n,3.5)*0.4);',
'  col+=color2*(cr+cr2);',
'  float vig=1.0-pow(r,2.5)*0.4;',
// Audio level brightens the whole pattern
'  col*=fd*brightness*vig*(1.0+audioLevel*0.5);',
'  float alpha=isWater>0.5 ? fd*(0.88+n*0.12) : fd*pow(n,0.38)*0.98;',
'  gl_FragColor=vec4(col,alpha);',
'}'
].join('\n');

// ── CIRCULAR ROOM ─────────────────────────────────────────────────────────────
var ROOM_R = 6.0;
var RH     = 3.85;

function mkMat(col, rough, metal, side) {
  return new THREE.MeshStandardMaterial({
    color: col, roughness: rough, metalness: metal||0,
    side: side || THREE.FrontSide
  });
}

// Polished dark concrete floor (slight sheen)
var floor = new THREE.Mesh(
  new THREE.CircleGeometry(ROOM_R, 128),
  mkMat(0x0c0b09, 0.32, 0.10)
);
floor.rotation.x = -Math.PI/2;
scene.add(floor);

// Ceiling — receives projection
var ceilBase = new THREE.Mesh(
  new THREE.CircleGeometry(ROOM_R, 128),
  mkMat(0x080809, 1.0, 0.0)
);
ceilBase.rotation.x = Math.PI/2;
ceilBase.position.y = RH;
scene.add(ceilBase);

// Circular acoustic fabric walls (inside face via BackSide)
var walls = new THREE.Mesh(
  new THREE.CylinderGeometry(ROOM_R, ROOM_R, RH, 128, 1, true),
  mkMat(0x101214, 0.99, 0.0, THREE.BackSide)
);
walls.position.y = RH/2;
scene.add(walls);

// Subtle wall base trim
var baseTrim = new THREE.Mesh(
  new THREE.CylinderGeometry(ROOM_R - 0.02, ROOM_R - 0.02, 0.06, 128, 1, true),
  mkMat(0x1a1814, 0.90, 0.0, THREE.BackSide)
);
baseTrim.position.y = 0.03;
scene.add(baseTrim);

// ── SATIN CURTAINS ────────────────────────────────────────────────────────────
var satinMat = new THREE.MeshStandardMaterial({
  color: 0x07070d,
  roughness: 0.13,
  metalness: 0.24,
  side: THREE.DoubleSide,
});
var N_PANELS = 72;
var foldDepths = [0.04, 0.20, 0.11, 0.17, 0.06, 0.14]; // gathered fold variation
for (var pi = 0; pi < N_PANELS; pi++) {
  var pa  = (pi / N_PANELS) * Math.PI * 2;
  var pr  = ROOM_R - 0.02 - foldDepths[pi % foldDepths.length];
  var pnl = new THREE.Mesh(new THREE.PlaneGeometry(0.70, RH), satinMat);
  pnl.position.set(Math.cos(pa)*pr, RH/2, Math.sin(pa)*pr);
  pnl.lookAt(new THREE.Vector3(0, RH/2, 0));
  scene.add(pnl);
}

// ── CYMATICS VESSEL (small, elegant focal object) ─────────────────────────────
var VR = 0.325;
var VH = 0.17;

// Wooden container body — warm dark walnut
var vWood = new THREE.Mesh(
  new THREE.CylinderGeometry(VR+0.05, VR+0.10, VH, 80),
  mkMat(0x3e2610, 0.90)
);
vWood.position.y = VH/2;
scene.add(vWood);

// Barrel bands
[0.045, 0.10, 0.155].forEach(function(yo) {
  var b = new THREE.Mesh(
    new THREE.TorusGeometry(VR+0.09, 0.012, 8, 80),
    mkMat(0x251508, 0.88)
  );
  b.rotation.x = Math.PI/2; b.position.y = yo; scene.add(b);
});

// Metal rim at top
var vRim = new THREE.Mesh(
  new THREE.TorusGeometry(VR+0.05, 0.020, 8, 80),
  mkMat(0x1c1c1c, 0.20, 0.92)
);
vRim.rotation.x = Math.PI/2; vRim.position.y = VH+0.003; scene.add(vRim);

// Metal plate (where patterns form)
var vPlate = new THREE.Mesh(
  new THREE.CylinderGeometry(VR, VR, 0.018, 80),
  mkMat(0x242428, 0.15, 0.90)
);
vPlate.position.y = VH+0.009; scene.add(vPlate);

// Cymatic pattern on plate
var PLATE_Y = VH+0.020;
var waterMat = new THREE.ShaderMaterial({
  uniforms: mkU(1.6, 1.0),
  vertexShader:VERT, fragmentShader:FRAG,
  transparent:true, depthWrite:false, side:THREE.DoubleSide,
});
var waterMesh = new THREE.Mesh(new THREE.CircleGeometry(VR-0.01, 128), waterMat);
waterMesh.rotation.x = -Math.PI/2;
waterMesh.position.y = PLATE_Y;
scene.add(waterMesh);


// ── CEILING PROJECTION (full room width, dreamlike) ───────────────────────────
var ceilBri = { value: P.ceilGlow * 3.8 };
var ceilUni = mkU(P.ceilGlow*3.8, 0.0);
ceilUni.brightness = ceilBri;
var ceilMat = new THREE.ShaderMaterial({
  uniforms: ceilUni,
  vertexShader:VERT, fragmentShader:FRAG,
  transparent:true, depthWrite:false,
  blending:THREE.AdditiveBlending, side:THREE.DoubleSide,
});
var ceilProj = new THREE.Mesh(new THREE.CircleGeometry(ROOM_R-0.15, 128), ceilMat);
ceilProj.rotation.x = Math.PI/2;
ceilProj.position.y = RH-0.005;
scene.add(ceilProj);

// ── RING OF LIGHT with camera at centre ───────────────────────────────────────
var PLATE_Y = VH + 0.020;
var RING_R  = 0.22;
var RING_Y  = PLATE_Y + 0.42;   // raised above plate

var rigMat  = mkMat(0x0d0d0d, 0.28, 0.78);
var lensMat = mkMat(0x050508, 0.04, 0.96);
var yUp     = new THREE.Vector3(0, 1, 0);

// Slim pedestal from plate centre up to ring
var pedH = RING_Y - PLATE_Y;
var ringPed = new THREE.Mesh(
  new THREE.CylinderGeometry(0.009, 0.015, pedH, 10), rigMat
);
ringPed.position.y = PLATE_Y + pedH/2;
scene.add(ringPed);

// Foot disc on plate
var ringFoot = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.012, 24), rigMat);
ringFoot.position.y = PLATE_Y + 0.006;
scene.add(ringFoot);

// The ring of light
var ringGlow = new THREE.Mesh(
  new THREE.TorusGeometry(RING_R, 0.016, 14, 90),
  new THREE.MeshBasicMaterial({ color: 0xdcf0ff })
);
ringGlow.rotation.x = Math.PI/2;
ringGlow.position.y = RING_Y;
scene.add(ringGlow);

// Three support spokes from pedestal to ring
for (var si=0; si<3; si++) {
  var sa  = (si/3)*Math.PI*2;
  var spk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.003, 0.003, RING_R-0.01, 6), rigMat
  );
  spk.position.set(Math.cos(sa)*(RING_R*0.5), RING_Y, Math.sin(sa)*(RING_R*0.5));
  spk.rotation.z = Math.PI/2;
  spk.rotation.y = sa;
  scene.add(spk);
}

// Camera body at centre of ring, pointing straight down
var camBody = new THREE.Mesh(new THREE.BoxGeometry(0.09, 0.07, 0.12), rigMat);
camBody.position.set(0, RING_Y, 0);
scene.add(camBody);

// Camera lens (pointing down)
var camLens = new THREE.Mesh(
  new THREE.CylinderGeometry(0.020, 0.025, 0.044, 16), lensMat
);
camLens.position.set(0, RING_Y - 0.055, 0);
scene.add(camLens);

// Lens glass
var camGlass = new THREE.Mesh(
  new THREE.CircleGeometry(0.017, 16),
  new THREE.MeshStandardMaterial({ color:0x102030, metalness:1.0, roughness:0.0 })
);
camGlass.rotation.x = -Math.PI/2;
camGlass.position.set(0, RING_Y - 0.076, 0);
scene.add(camGlass);

// Red LED
var ledDot = new THREE.Mesh(
  new THREE.SphereGeometry(0.007, 8, 6),
  new THREE.MeshBasicMaterial({ color:0xff3300 })
);
ledDot.position.set(0.035, RING_Y + 0.038, 0.045);
scene.add(ledDot);

// ── CEILING-SUSPENDED PROJECTOR ───────────────────────────────────────────────
var PJX = 0.0, PJZ = 0.0;      // centred above vessel
var DROP_LEN  = 2.72;            // hangs close to camera/ring
var PROJ_BODY_Y = RH - DROP_LEN - 0.05;

// Ceiling mount plate
var ceilMount = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.04, 0.18), rigMat);
ceilMount.position.set(PJX, RH-0.02, PJZ);
scene.add(ceilMount);

// Drop rod
var dropRod = new THREE.Mesh(
  new THREE.CylinderGeometry(0.012, 0.012, DROP_LEN, 8), rigMat
);
dropRod.position.set(PJX, RH - DROP_LEN/2, PJZ);
scene.add(dropRod);

// Projector body (hanging, lens pointing down toward plate)
var projBody = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.10, 0.16), rigMat);
projBody.position.set(PJX, PROJ_BODY_Y, PJZ);
scene.add(projBody);

// Projector lens (pointing down)
var projLens = new THREE.Mesh(new THREE.CylinderGeometry(0.026, 0.032, 0.048, 16), lensMat);
projLens.position.set(PJX, PROJ_BODY_Y - 0.074, PJZ);
scene.add(projLens);

// Lens glow
var projGlow = new THREE.Mesh(
  new THREE.CircleGeometry(0.022, 16),
  new THREE.MeshBasicMaterial({ color:0x3060ff })
);
projGlow.rotation.x = Math.PI/2;
projGlow.position.set(PJX, PROJ_BODY_Y - 0.098, PJZ);
scene.add(projGlow);

// Vertical cable from camera up to projector (both centred at x=0, z=0)
var cableLen = PROJ_BODY_Y - RING_Y - 0.04;
var cableMesh = new THREE.Mesh(
  new THREE.CylinderGeometry(0.004, 0.004, cableLen, 6), mkMat(0x080808, 0.92)
);
cableMesh.position.set(0, RING_Y + 0.04 + cableLen/2, 0);
scene.add(cableMesh);

// Projection beam (from projector lens downward to plate — subtle cone)
var beamH = PROJ_BODY_Y - PLATE_Y - 0.05;
var beamMesh = new THREE.Mesh(
  new THREE.CylinderGeometry(VR*1.1, 0.024, beamH, 40, 1, true),
  new THREE.MeshBasicMaterial({ color:0x1828c0, transparent:true, opacity:0.055, depthWrite:false, side:THREE.BackSide })
);
beamMesh.position.set(PJX, PLATE_Y + beamH/2, PJZ);
scene.add(beamMesh);

// ── LIGHTS ────────────────────────────────────────────────────────────────────

// Ambient — very low, room lit primarily by projection
var ambLight = new THREE.AmbientLight(0x0c1830, P.ambient * 10);
scene.add(ambLight);

// Ceiling projection fill (primary room light — bounced from ceiling)
var ceilLight = new THREE.PointLight(0x2858c8, P.ceilGlow * 4.5, 14);
ceilLight.position.set(0, RH-0.15, 0);
scene.add(ceilLight);

// Plate/vessel glow
var plateGlow = new THREE.PointLight(0x1838a0, 2.8, 4.0);
plateGlow.position.set(0, VH*0.4, 0);
scene.add(plateGlow);

// Ring of light fill
var ringLight = new THREE.PointLight(0xc0dcff, 5.0, 4.2);
ringLight.position.set(0, RING_Y, 0);
scene.add(ringLight);

// Projector downward spot (ceiling projector onto plate)
var projSpot = new THREE.SpotLight(0x1530b0, P.ceilGlow*2.0, RH, Math.PI*0.18, 0.6, 1.0);
projSpot.position.set(PJX, PROJ_BODY_Y, PJZ);
projSpot.target.position.set(0, PLATE_Y, 0);
scene.add(projSpot); scene.add(projSpot.target);

// Under-seating warm glow ring
for (var li=0; li<12; li++) {
  var la = (li/12)*Math.PI*2;
  var wl = new THREE.PointLight(0x200a04, 0.50, 2.2);
  wl.position.set(Math.cos(la)*2.2, 0.04, Math.sin(la)*2.2);
  scene.add(wl);
}

// Soft wall grazing
for (var wi=0; wi<6; wi++) {
  var wa = (wi/6)*Math.PI*2;
  var wgl = new THREE.PointLight(0x0a1424, 0.55, 5.0);
  wgl.position.set(Math.cos(wa)*(ROOM_R-0.8), 0.6, Math.sin(wa)*(ROOM_R-0.8));
  scene.add(wgl);
}

// ── BEAN BAGS + CUSHIONS ──────────────────────────────────────────────────────
var bagCols  = [0x1a1828, 0x201418, 0x14201c, 0x1e1c14, 0x181428, 0x201c18];
var cushCols = [0x2a2038, 0x28201a, 0x1e2830, 0x242018, 0x20283a, 0x302020];

// Drag state
var _dragTargets = [];   // meshes to raycast
var _dragRoot    = null; // group/mesh being dragged
var _dragRay     = new THREE.Raycaster();
var _dragMouse   = new THREE.Vector2();
var _floorPlane  = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
var _dragHit     = new THREE.Vector3();
var _dragOff     = new THREE.Vector3();

function makeBeanBag(x, z, col) {
  var g = new THREE.Group();
  g.position.set(x, 0, z);
  scene.add(g);

  var disc = new THREE.Mesh(
    new THREE.CylinderGeometry(0.42, 0.40, 0.04, 24),
    mkMat(0x0e0c0a, 0.98)
  );
  disc.position.y = 0.02; g.add(disc);

  var body = new THREE.Mesh(
    new THREE.SphereGeometry(0.40, 20, 14),
    mkMat(col, 0.96)
  );
  body.scale.set(1.0, 0.62, 1.0);
  body.position.y = 0.28; g.add(body);

  var top = new THREE.Mesh(
    new THREE.SphereGeometry(0.18, 16, 8),
    mkMat(Math.max(0, col - 0x080808), 0.97)
  );
  top.scale.set(1.0, 0.35, 1.0);
  top.position.y = 0.50; g.add(top);

  // Register all children as drag handles
  g.children.forEach(function(child) { child.userData.dragRoot = g; _dragTargets.push(child); });
}

function makeFloorCushion(x, z, ry, col) {
  var c = new THREE.Mesh(
    new THREE.BoxGeometry(0.52, 0.09, 0.52),
    mkMat(col, 0.97)
  );
  c.position.set(x, 0.045, z);
  c.rotation.y = ry;
  c.userData.dragRoot = c;
  scene.add(c);
  _dragTargets.push(c);
}

// Inner ring — 12 bean bags at radius 2.0m
var NB = 12, BR = 2.0;
for (var bi=0; bi<NB; bi++) {
  var ba = (bi/NB)*Math.PI*2;
  makeBeanBag(
    Math.cos(ba)*BR,
    Math.sin(ba)*BR,
    bagCols[bi % bagCols.length]
  );
}

// Outer ring — 10 more bean bags at radius 3.5m
var NB2 = 10, BR2 = 3.5;
for (var bi2=0; bi2<NB2; bi2++) {
  var ba2 = (bi2/NB2)*Math.PI*2 + Math.PI/NB2;
  makeBeanBag(
    Math.cos(ba2)*BR2,
    Math.sin(ba2)*BR2,
    bagCols[(bi2+2) % bagCols.length]
  );
}

// Loose cushions scattered between inner and outer rings
var NC = 16;
for (var ci=0; ci<NC; ci++) {
  var ca = (ci/NC)*Math.PI*2 + 0.18;
  var cr = 2.75 + (ci%3===0 ? 0.4 : ci%3===1 ? -0.3 : 0.1);
  makeFloorCushion(
    Math.cos(ca)*cr, Math.sin(ca)*cr,
    ca + ci*0.4,
    cushCols[ci % cushCols.length]
  );
}


// ── HAZE LAYERS (volumetric feel) ────────────────────────────────────────────
var hazeLayers = [];
[0.65, 1.3, 2.0, 2.65, 3.30].forEach(function(hy, i) {
  var hm = new THREE.Mesh(
    new THREE.CircleGeometry(ROOM_R-0.1, 80),
    new THREE.MeshBasicMaterial({
      color:0x04091a, transparent:true,
      opacity: P.haze*0.045*(1-i*0.16),
      depthWrite:false, side:THREE.DoubleSide,
    })
  );
  hm.rotation.x = Math.PI/2; hm.position.y = hy; scene.add(hm);
  hazeLayers.push(hm);
});

// ── DAT.GUI ───────────────────────────────────────────────────────────────────
var gui = new dat.GUI({ width: 298 });

var fC = gui.addFolder('Cymatics');
fC.add(P,'frequency',0.5,10,0.05).name('Frequency').onChange(function(v){ uFreq.value=v; });

var fK = gui.addFolder('Colors');

gui.add(P,'fogDensity',0.01,0.15,0.002).name('Fog Density').onChange(function(v){
  scene.fog.density=v;
});

function applyPreset(cfg) {
  Object.assign(P,cfg);
  uFreq.value=P.frequency; uSpeed.value=P.speed; uComp.value=P.complexity;
  uC1.value.set(P.colorDark); uC2.value.set(P.colorBright); uC3.value.set(P.colorAccent);
  scene.fog.density=P.fogDensity; ambLight.intensity=P.ambient*10;
  ceilBri.value=P.ceilGlow*3.8; ceilLight.intensity=P.ceilGlow*4.5;
  projSpot.intensity=P.ceilGlow*2.0; floorReflBri.value=P.ceilGlow*0.12;
  hazeLayers.forEach(function(m,i){ m.material.opacity=P.haze*0.045*(1-i*0.16); });
  gui.updateDisplay();
}

var PRESETS = {
  'Moonlit': {frequency:2.8,speed:0.22,complexity:3,colorDark:'#010614',colorBright:'#7aaeff',colorAccent:'#2840b0',fogDensity:0.036,ambient:0.12,ceilGlow:1.4,haze:0.55},
  'Aurora':  {frequency:1.8,speed:0.14,complexity:2,colorDark:'#001812',colorBright:'#00e8b0',colorAccent:'#003828',fogDensity:0.048,ambient:0.10,ceilGlow:1.3,haze:0.65},
  'Ember':   {frequency:4.0,speed:0.40,complexity:4,colorDark:'#160400',colorBright:'#ff8020',colorAccent:'#700800',fogDensity:0.042,ambient:0.14,ceilGlow:1.5,haze:0.45},
  'Void':    {frequency:5.5,speed:0.65,complexity:4,colorDark:'#040010',colorBright:'#d4b8ff',colorAccent:'#180080',fogDensity:0.065,ambient:0.08,ceilGlow:1.7,haze:0.80},
};

var fP = gui.addFolder('Presets');
Object.keys(PRESETS).forEach(function(name){

  fP.add({fn:function(){applyPreset(cfg);}}, 'fn').name(name);

fP.open();

// ── ANIMATE ───────────────────────────────────────────────────────────────────
var clock = new THREE.Clock();

// Persistent smoothed audio values — separate from raw analyser output
var sBass = 0, sMid = 0, sHigh = 0, sLevel = 0;

// ── AUDIO ENGINE ─────────────────────────────────────────────────────────────
var audioCtx = null, analyser = null, freqData = null, audioEl = null;
var isPlaying = false, seekDragging = false;

function formatTime(s) {
  s = Math.floor(s || 0);
  var h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  if (h > 0) return h+':'+(m<10?'0':'')+m+':'+(sec<10?'0':'')+sec;
  return m+':'+(sec<10?'0':'')+sec;
}

function initAudio(file) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();

  if (audioEl) { audioEl.pause(); audioEl.src = ''; }
  audioEl = new Audio();
  audioEl.src = URL.createObjectURL(file);
  audioEl.loop = true;

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.94;
  freqData = new Uint8Array(analyser.frequencyBinCount);

  var src = audioCtx.createMediaElementSource(audioEl);
  src.connect(analyser);
  analyser.connect(audioCtx.destination);

  audioEl.addEventListener('loadedmetadata', function() {
    var sb = document.getElementById('seekBar');
    sb.max = Math.floor(audioEl.duration);
    document.getElementById('durTime').textContent = formatTime(audioEl.duration);
  });

  audioEl.addEventListener('timeupdate', function() {
    if (seekDragging) return;
    document.getElementById('seekBar').value = Math.floor(audioEl.currentTime);
    document.getElementById('curTime').textContent = formatTime(audioEl.currentTime);
  });

  audioEl.play();
  isPlaying = true;
  document.getElementById('playBtn').innerHTML = '&#9646;&#9646;';
}

function getAudioLevels() {
  if (!analyser) return { bass:0, mid:0, high:0, level:0 };
  analyser.getByteFrequencyData(freqData);
  var bass=0, mid=0, high=0;
  for (var i=0;  i<8;   i++) bass += freqData[i];
  for (var i=8;  i<80;  i++) mid  += freqData[i];
  for (var i=80; i<512; i++) high += freqData[i];
  bass = bass/(8*255); mid = mid/(72*255); high = high/(432*255);
  return { bass:bass, mid:mid, high:high, level:bass*0.55+mid*0.30+high*0.15 };
}

// Upload
document.getElementById('audioFile').addEventListener('change', function(e) {
  var file = e.target.files[0]; if (!file) return;
  initAudio(file);
  ['playBtn','curTime','seekBar','durTime','vuMeter'].forEach(function(id) {
    var el = document.getElementById(id);
    el.style.display = (id === 'vuMeter') ? 'flex' : 'inline-block';
  });
  document.getElementById('curTime').style.display = 'inline';
  document.getElementById('durTime').style.display = 'inline';
});

// Play / pause
document.getElementById('playBtn').addEventListener('click', function() {
  if (!audioEl) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (isPlaying) {
    audioEl.pause(); this.innerHTML = '&#9654;'; isPlaying = false;
  } else {
    audioEl.play(); this.innerHTML = '&#9646;&#9646;'; isPlaying = true;
  }
});

// Seek bar
document.getElementById('seekBar').addEventListener('mousedown',  function(){ seekDragging = true; });
document.getElementById('seekBar').addEventListener('touchstart', function(){ seekDragging = true; });
document.getElementById('seekBar').addEventListener('input', function(){
  document.getElementById('curTime').textContent = formatTime(this.value);
});
document.getElementById('seekBar').addEventListener('change', function(){
  if (audioEl) audioEl.currentTime = parseFloat(this.value);
  seekDragging = false;
});

// ── ADD / DELETE CUSHIONS ─────────────────────────────────────────────────────
var cushionIdx = 0;
var deleteMode = false;

document.getElementById('addCushionBtn').addEventListener('click', function() {
  var angle  = Math.random() * Math.PI * 2;
  var radius = 1.4 + Math.random() * 2.4;
  var x = Math.cos(angle) * radius;
  var z = Math.sin(angle) * radius;
  var col = cushCols[cushionIdx++ % cushCols.length];
  var mesh = new THREE.Mesh(
    new THREE.BoxGeometry(0.52, 0.09, 0.52),
    mkMat(col, 0.97)
  );
  mesh.position.set(x, 0.045, z);
  mesh.rotation.y = Math.random() * Math.PI;
  mesh.userData.dragRoot = mesh;
  scene.add(mesh);
  _dragTargets.push(mesh);
});

document.getElementById('deleteModeBtn').addEventListener('click', function() {
  deleteMode = !deleteMode;
  this.style.color       = deleteMode ? '#ff5544' : '#5a8adf';
  this.style.borderColor = deleteMode ? '#882233' : '#1a3a5a';
  this.textContent       = deleteMode ? '✕ DELETING' : '✕ DELETE';
  // Cursor hint
  renderer.domElement.style.cursor = deleteMode ? 'crosshair' : 'default';
});

// ── DRAG TO REARRANGE cushions & bean bags ────────────────────────────────────
renderer.domElement.addEventListener('pointerdown', function(e) {
  _dragMouse.x = (e.clientX/innerWidth)*2 - 1;
  _dragMouse.y = -(e.clientY/innerHeight)*2 + 1;
  _dragRay.setFromCamera(_dragMouse, camera);
  var hits = _dragRay.intersectObjects(_dragTargets, false);
  if (hits.length === 0) return;

  var root = hits[0].object.userData.dragRoot;

  if (deleteMode) {
    // Remove from scene
    scene.remove(root);
    // Remove all _dragTargets entries that belong to this root
    for (var di = _dragTargets.length - 1; di >= 0; di--) {
      if (_dragTargets[di] === root || _dragTargets[di].userData.dragRoot === root) {
        _dragTargets.splice(di, 1);
      }
    }
    return;
  }

  _dragRoot = root;
  controls.enabled = false;
  _dragRay.ray.intersectPlane(_floorPlane, _dragHit);
  _dragOff.set(_dragHit.x - _dragRoot.position.x, 0, _dragHit.z - _dragRoot.position.z);
});

renderer.domElement.addEventListener('pointermove', function(e) {
  if (!_dragRoot) return;
  _dragMouse.x = (e.clientX/innerWidth)*2 - 1;
  _dragMouse.y = -(e.clientY/innerHeight)*2 + 1;
  _dragRay.setFromCamera(_dragMouse, camera);
  if (_dragRay.ray.intersectPlane(_floorPlane, _dragHit)) {
    var nx = _dragHit.x - _dragOff.x;
    var nz = _dragHit.z - _dragOff.z;
    // Constrain inside room
    var d = Math.sqrt(nx*nx + nz*nz);
    if (d > ROOM_R - 0.55) { nx *= (ROOM_R-0.55)/d; nz *= (ROOM_R-0.55)/d; }
    _dragRoot.position.x = nx;
    _dragRoot.position.z = nz;
  }
});

renderer.domElement.addEventListener('pointerup', function() {
  _dragRoot = null;
  controls.enabled = true;
});

function animate() {
  requestAnimationFrame(animate);
  var t = clock.getElapsedTime();
  uTime.value = t;

  var pulse = 0.65 + 0.28*Math.sin(t*0.78) + 0.14*Math.sin(t*1.61) + 0.07*Math.sin(t*2.97);

  // Audio reactivity
  var au = getAudioLevels();

  // Two-stage smoothing: first pass (slow), second pass (very slow for frequency)
  var k1 = 0.018;   // slow envelope — ~3s response
  sBass  += (au.bass  - sBass)  * k1;
  sMid   += (au.mid   - sMid)   * k1;
  sHigh  += (au.high  - sHigh)  * k1;
  sLevel += (au.level - sLevel) * k1;

  // Feed smoothed values into shader uniforms
  uBass.value  = sBass;
  uMid.value   = sMid;
  uHigh.value  = sHigh;
  uLevel.value = sLevel;

  // Frequency drifts very slowly with bass — second lerp pass (k=0.006 ≈ 8s response)
  var targetFreq = P.frequency * (1.0 + sBass * 3.0);
  uFreq.value += (targetFreq - uFreq.value) * 0.006;

  // Lights — also use smoothed values so no snapping
  var beatPulse = pulse + sBass * 1.4;
  ceilLight.intensity  = P.ceilGlow * 4.5 * (0.78 + beatPulse*0.22);
  plateGlow.intensity  = 2.2 + beatPulse*0.65;
  ringLight.intensity  = (4.5 + beatPulse*0.65) * (1.0 + sBass*0.8);
  ceilBri.value        = P.ceilGlow * 3.8 * (1.0 + sLevel * 0.5);

  // VU meter shows raw (unsmoothed) for responsiveness
  if (analyser) {
    var vuVals = [au.bass, (au.bass+au.mid)*0.5, au.mid, (au.mid+au.high)*0.5, au.high];
    for (var vi=0; vi<5; vi++) {
      var el = document.getElementById('vu'+vi);
      if (el) { el.style.height = Math.max(2, vuVals[vi]*16)+'px'; el.style.background='#2a5adf'; }
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

// ── RESIZE ────────────────────────────────────────────────────────────────────
window.addEventListener('resize', function() {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
